<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A daily-updated price index for Indian domestic airfares, built from real prices collected from airline websites."
    />
    <title>Airfare Price Index</title>
    <script>
      // Applied before first paint so a stored theme choice never flashes
      // the wrong colors for a frame — see src/theme.ts for the React side.
      (function () {
        try {
          var t = localStorage.getItem("airfare-idex-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
